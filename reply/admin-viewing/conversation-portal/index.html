<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Replies — Admin</title>
    <link rel="stylesheet" href="../../../css/styles.css?v=3">
    <style>
        [hidden] { display: none !important; }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg-primary);
            color: var(--color-text-primary);
            min-height: 100vh;
        }

        .reply-wrap {
            max-width: 1120px;
            margin: 0 auto;
            padding: var(--space-8) var(--space-5);
            display: flex;
            flex-direction: column;
            gap: var(--space-6);
        }

        .reply-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
        }

        .reply-header h1 {
            font-size: var(--text-2xl);
            margin: 0;
        }

        .reply-status {
            font-size: var(--text-sm);
            color: var(--color-text-secondary);
        }

        .login-card {
            max-width: 360px;
            margin: var(--space-12) auto;
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .login-error {
            font-size: var(--text-sm);
            color: var(--color-error);
            min-height: 1em;
            margin: 0;
        }

        .rules-warning {
            color: var(--color-error);
            background-color: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-3);
        }

        .reply-main {
            display: flex;
            align-items: flex-start;
            gap: var(--space-5);
        }

        .convo-list {
            width: 300px;
            flex-shrink: 0;
            max-height: 70vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            padding: var(--space-2);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background-color: var(--color-bg-card);
        }

.convo-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: var(--space-3);
    background: none;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    text-align: left;
    cursor: pointer;
    position: relative;
    transition: background-color var(--transition-fast), border-color var(--transition-fast);
}

.convo-badge {
    position: absolute;
    top: var(--space-2);
    right: var(--space-2);
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--color-error, #ef4444);
    color: #ffffff;
    font-size: var(--text-xs);
    font-weight: 700;
    line-height: 1;
    border-radius: var(--radius-full);
    box-sizing: content-box;
}

        .convo-item:hover {
            background-color: var(--color-bg-hover);
        }

        .convo-item.active {
            border-color: var(--color-accent);
            background-color: var(--color-accent-subtle);
        }

        .convo-name {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .convo-meta {
            font-size: var(--text-xs);
            color: var(--color-text-muted);
        }

        .thread {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .thread-head {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .thread-head .convo-name {
            font-size: var(--text-base);
        }

        .thread-messages {
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background-color: var(--color-bg-primary);
            min-height: 320px;
            max-height: 55vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            padding: var(--space-3);
        }

        .reply-form {
            display: flex;
            gap: var(--space-3);
        }

        .reply-form input {
            flex: 1;
            min-width: 0;
            padding: var(--space-2) var(--space-3);
            font-family: var(--font-sans);
            font-size: var(--text-sm);
            background-color: var(--color-bg-primary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            transition: border-color var(--transition-fast);
        }

        .reply-form input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .reply-form input::placeholder {
            color: var(--color-text-muted);
        }

        @media (max-width: 768px) {
            .reply-main {
                flex-direction: column;
            }

            .convo-list {
                width: 100%;
                max-height: 240px;
            }
        }
    </style>
</head>
<body>
    <div class="reply-wrap">
        <header class="reply-header">
            <h1>Replies</h1>
            <span id="auth-status" class="reply-status">Checking session...</span>
            <button type="button" id="logout-btn" class="btn btn-primary" hidden>Sign out</button>
        </header>

        <p class="reply-status rules-warning" id="rules-warning" hidden></p>

        <section class="login-card" id="login-view" hidden>
            <p class="chat-hint">Owner sign in to reply to conversations.</p>
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" autocomplete="current-password">
            </div>
            <button type="button" class="btn btn-primary btn-full" id="login-btn">Sign in</button>
            <p class="login-error" id="login-error"></p>
        </section>

        <main class="reply-main" id="replies-view" hidden>
            <aside class="convo-list" id="convo-list">
                <p class="reply-status">Loading conversations...</p>
            </aside>
            <section class="thread" id="thread" hidden>
                <div class="thread-head">
                    <span class="convo-name" id="thread-name"></span>
                    <span class="convo-meta" id="thread-meta"></span>
                </div>
                <div class="thread-messages" id="thread-messages" aria-live="polite"></div>
                <form class="reply-form" id="reply-form">
                    <input type="text" id="reply-input" placeholder="Type your reply..." autocomplete="off" required>
                    <button type="submit" class="btn btn-primary">Send</button>
                </form>
            </section>
        </main>
    </div>

    <script type="module" src="../../../js/reply-app.js?v=7"></script>
</body>
</html>
